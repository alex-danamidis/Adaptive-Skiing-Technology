[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Configure 16MB Flash + 8MB Octal PSRAM (N16R8)
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = default_16MB.csv

; Use LittleFS for the /data folder
board_build.filesystem = littlefs

build_unflags = 
    -std=gnu++11

build_flags = 
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -Isrc
    -Isrc/edge-impulse-sdk/porting/espressif/ESP-NN/include
    -Isrc/edge-impulse-sdk/porting/espressif/ESP-NN/src/common
    -DEI_CLASSIFIER_TFLITE_ENABLE_ESP_NN=1
    -DEI_CLASSIFIER_TFLITE_ENABLE_ESP_DSP=0
    -Wno-unused-function
    -O3

; Strictly exclude all foreign porting layers, then allow ONLY Arduino + ESP-NN
build_src_filter = 
    +<*>
    -<edge-impulse-sdk/porting/**>
    +<edge-impulse-sdk/porting/espressif/ei_classifier_porting.cpp>
    +<edge-impulse-sdk/porting/espressif/debug_log.cpp>
    -<edge-impulse-sdk/porting/espressif/ESP-NN/**>
    -<edge-impulse-sdk/porting/espressif/esp-dsp/**>
    -<edge-impulse-sdk/CMSIS/NN/**>